name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build Island.exe
        shell: pwsh
        run: |
          # the tag (v1.2.0) becomes the app's version, so the in-app updater always matches the release
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v?(\d+\.\d+\.\d+)') { $Matches[1] } else { '1.0.0' }
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$ver -o out
      - uses: actions/upload-artifact@v4
        with: { name: Island-win-x64, path: out/Island.exe }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: out/Island.exe }
